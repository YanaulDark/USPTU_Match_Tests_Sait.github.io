<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мастерская вопросов</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">LectureHub</div>
  <nav>
    <a href="/teacher">Лекции</a>
    <a href="/workshop" class="active">Мастерская</a>
  </nav>
</header>

<main class="workshop">
  <h1>Творческая мастерская</h1>
  <p class="hint">Создавайте вопросы к слайдам ваших презентаций</p>

  <div class="card">
    <label>Лекция</label>
    <select id="lectureSelect"></select>

    <label>Номер слайда</label>
    <input type="number" id="slideNum" min="1" value="1">

    <label>Текст вопроса</label>
    <textarea id="qText" rows="3"></textarea>

    <label>Варианты ответа</label>
    <input class="opt" placeholder="Вариант A">
    <input class="opt" placeholder="Вариант B">
    <input class="opt" placeholder="Вариант C">
    <input class="opt" placeholder="Вариант D">

    <label>Правильный вариант</label>
    <select id="correct">
      <option value="0">A</option><option value="1">B</option>
      <option value="2">C</option><option value="3">D</option>
    </select>

    <button class="btn primary" id="addQ">Добавить вопрос</button>
  </div>

  <h2>Список вопросов</h2>
  <div id="qList" class="list"></div>
</main>

<script src="/static/js/workshop.js"></script>
</body>
</html>
